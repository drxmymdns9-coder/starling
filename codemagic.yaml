workflows:
  ios-sideload:
    name: Horizon iOS sideload
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.example.horizonios
      ios_signing:
        distribution_type: development
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Install Rust and XcodeGen
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          brew install xcodegen || true
      - name: Build Rust iOS static library
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          bash scripts/build-ios-rust.sh
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml
      - name: Apply Codemagic signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/HorizonIOS.xcodeproj" \
            --scheme HorizonIOS
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
