workflows:
  ios-unsigned:
    name: Horizon iOS unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.example.horizonios
    scripts:
      - name: Install Rust and XcodeGen
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          brew install xcodegen || true
      - name: Build Rust iOS static library
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          bash scripts/build-ios-rust.sh
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          rm -rf build/ios/derived build/ios/ipa build/ios/Payload
          mkdir -p build/ios/ipa build/ios/Payload
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/HorizonIOS.xcodeproj" \
            -scheme HorizonIOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build
          APP_PATH="$CM_BUILD_DIR/build/ios/derived/Build/Products/Release-iphoneos/Horizon.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" build/ios/Payload/Horizon.app
          (cd build/ios && zip -qry ipa/Horizon-unsigned.ipa Payload)
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
